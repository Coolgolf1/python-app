<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {

            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: "Comic Sans";
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: #1e3c72;
            background-image:
                linear-gradient(rgba(20, 41, 83, 0.42), rgba(20, 41, 83, 0.58)),
                url("{{ url_for('static', filename='images/clippy-widened-pixelated.png') }}");
            background-position: center;
            background-size: cover;
            background-attachment: fixed
        }
        .site-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(13, 33, 75, 0.16);
        }
        .navbar {
            padding-block: 0.8rem;
        }
        .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        .brand-mark {
            display: grid;
            width: 2.35rem;
            height: 2.35rem;
            place-items: center;
            border-radius: 0.75rem;
            color: #1e3c72;
            background: #fff;
        }
        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.86);
            font-weight: 600;
        }
        .navbar .nav-link:hover,
        .navbar .nav-link:focus {
            color: #fff;
        }
        .navbar-note {
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.9rem;

        }
        .converter-card {
            border-radius: 60px;
            border-color: blue;
            backdrop-filter: blur(10px);
            background: rgba(255, 0, 0, 0.95);
        }
        .result-box {
            font-size: 10rem;
            font-weight: bold;
            text-decoration: underline;
            font-family: "Comic Sans";
            color: #198754;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <nav class="navbar navbar-expand navbar-dark" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand" href="#conversor" aria-label="Cambio, inicio">
                    <span class="brand-mark" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 8h14m0 0-3-3m3 3-3 3M20 16H6m0 0 3-3m-3 3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span>Cambio</span>
                </a>
                <div class="navbar-nav flex-row align-items-center gap-3 gap-md-4 ms-auto">
                    <a class="nav-link active p-0" aria-current="page" href="#conversor">Conversor</a>
                    <span class="navbar-note d-none d-sm-inline">Rápido y sencillo</span>
                </div>
            </div>
        </nav>
    </header>

    <main id="conversor" class="card shadow-lg p-4 converter-card mx-auto my-auto" style="width: 400px;">
        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" step="0.01" name="amount"
                       class="form-control form-control-lg"
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <select name="from_currency" class="form-select">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
                <div class="col text-center align-self-center">
                    →
                </div>
                <div class="col">
                    <select name="to_currency" class="form-select">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box">
                {{ result }}
            </div>
        {% endif %}
    </main>

</body>
</html>
